# Serves the static Astro build (multi-page). Clean URLs resolve to the
# generated per-route index.html; unknown paths 404 (no SPA catch-all).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness target for k8s probes.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Long-cache fingerprinted/static assets.
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
