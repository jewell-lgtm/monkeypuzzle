# Private piece registry: Postgres + mp-server. PR monitoring is optional:
# PR_SYNC_ENABLED=true docker compose --profile pr-monitoring up --build
#
#   cp .env.example .env   # fill in WorkOS creds + secrets
#   docker compose up --build
#
# Web UI:       http://localhost:8080
# Temporal UI:  http://localhost:8233
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mp
      POSTGRES_PASSWORD: mp
      POSTGRES_DB: mp
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]

  temporal:
    profiles: [pr-monitoring]
    # Lightweight in-memory dev server (frontend 7233, web UI 8233).
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--log-level", "warn"]
    ports: ["7233:7233", "8233:8233"]

  mp-server:
    build:
      context: ../..
      dockerfile: apps/mp-server/Dockerfile
    command: ["serve"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://mp:mp@postgres:5432/mp?sslmode=disable
      TEMPORAL_HOSTPORT: temporal:7233
      PR_SYNC_ENABLED: ${PR_SYNC_ENABLED:-false}
      # GitLab login is opt-in: set the OAuth client id/secret in .env to enable
      # the "Sign in with GitLab" leg. GITLAB_BASE_URL defaults to gitlab.com.
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}

  mp-worker:
    profiles: [pr-monitoring]
    build:
      context: ../..
      dockerfile: apps/mp-server/Dockerfile
    command: ["worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://mp:mp@postgres:5432/mp?sslmode=disable
      TEMPORAL_HOSTPORT: temporal:7233
      PR_SYNC_ENABLED: "true"
      # The worker reads GitLab projects/MRs; it needs the base URL but no OAuth
      # secrets (the access token is decrypted from the store per user).
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
    depends_on:
      postgres: {condition: service_healthy}
      temporal: {condition: service_started}

volumes:
  pgdata:
