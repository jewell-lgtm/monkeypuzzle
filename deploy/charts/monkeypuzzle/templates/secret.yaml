{{- if not .Values.existingSecret }}
{{- $fullName := include "monkeypuzzle.fullname" . }}
{{- /* Resolve the Postgres password once: explicit value, else the previously
       generated one (stable across upgrades), else a fresh random one. */}}
{{- $pgPass := .Values.postgres.auth.password }}
{{- if and .Values.postgres.enabled (not $pgPass) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullName }}
{{- if and $existing $existing.data (hasKey $existing.data "POSTGRES_PASSWORD") }}
{{- $pgPass = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pgPass = randAlphaNum 32 }}
{{- end }}
{{- end }}
{{- $dbURL := "" }}
{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres.auth }}
{{- $dbURL = printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" $pg.username $pgPass (include "monkeypuzzle.postgresHost" .) $pg.database }}
{{- else }}
{{- $dbURL = required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "monkeypuzzle.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $dbURL | quote }}
  WORKOS_API_KEY: {{ required "workos.apiKey is required" .Values.workos.apiKey | quote }}
  WORKOS_CLIENT_ID: {{ required "workos.clientId is required" .Values.workos.clientId | quote }}
  AUTHKIT_DOMAIN: {{ required "workos.authkitDomain is required" .Values.workos.authkitDomain | quote }}
  SESSION_SECRET: {{ required "secrets.sessionSecret is required (openssl rand -base64 32)" .Values.secrets.sessionSecret | quote }}
  TOKEN_ENCRYPTION_KEY: {{ required "secrets.tokenEncryptionKey is required (openssl rand -base64 32)" .Values.secrets.tokenEncryptionKey | quote }}
{{- if .Values.postgres.enabled }}
  POSTGRES_USER: {{ .Values.postgres.auth.username | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | quote }}
{{- end }}
{{- end }}
