{{- if .Values.ingress.enabled }}
{{- $fullName := include "monkeypuzzle.fullname" . }}
{{- $host := .Values.ingress.host | default (regexReplaceAll ":[0-9]+$" (urlParse .Values.publicBaseURL).host "") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "monkeypuzzle.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host or publicBaseURL must resolve a host" $host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ $fullName }}-server
                port:
                  number: {{ .Values.server.service.port }}
{{- end }}
