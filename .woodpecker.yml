workspace:
  base: /woodpecker
  path: src

variables:
  - &golang_image golang:1.26.4
  - &kaniko_image gcr.io/kaniko-project/executor:v1.23.2-debug
  # In-cluster registry (insecure, NodePort-backed). Same one ArgoCD pulls from.
  - &registry registry.registry.svc.cluster.local:5000

steps:
  # --- Verify: build, vet, test, lint the Go modules -----------------------
  - name: test
    image: *golang_image
    environment:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    commands:
      - go build -o /dev/null ./apps/mp
      - go build -o /dev/null ./apps/mp-mcp
      - go build -o /dev/null ./apps/mp-server
      - go vet ./...
      - go test -race ./...
      - go test -race -tags=integration ./...

  - name: lint
    image: golangci/golangci-lint:latest
    commands:
      - golangci-lint run

  # --- Build + push images to the in-cluster registry (main only) ----------
  - name: build-server
    image: *kaniko_image
    commands:
      - >
        SHORT_SHA=$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-8);
        DESTINATIONS="--destination=$${REGISTRY}/monkeypuzzle-server:$SHORT_SHA";
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          DESTINATIONS="$DESTINATIONS --destination=$${REGISTRY}/monkeypuzzle-server:latest";
        fi;
        /kaniko/executor
        --context=dir:///woodpecker/src
        --dockerfile=apps/mp-server/Dockerfile
        $DESTINATIONS
        --cache=true
        --cache-repo=$${REGISTRY}/monkeypuzzle-server-cache
        --use-new-run
        --compressed-caching=false
        --image-download-retry=3
        --push-retry=3
        --insecure
        --insecure-pull
    environment:
      REGISTRY: *registry
    when:
      branch: main
      event: push

  - name: build-website
    image: *kaniko_image
    environment:
      REGISTRY: *registry
    commands:
      - >
        SHORT_SHA=$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-8);
        DESTINATIONS="--destination=$${REGISTRY}/monkeypuzzle-website:$SHORT_SHA";
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          DESTINATIONS="$DESTINATIONS --destination=$${REGISTRY}/monkeypuzzle-website:latest";
        fi;
        /kaniko/executor
        --context=dir:///woodpecker/src/website
        --dockerfile=/woodpecker/src/website/Dockerfile
        $DESTINATIONS
        --cache=true
        --cache-repo=$${REGISTRY}/monkeypuzzle-website-cache
        --use-new-run
        --compressed-caching=false
        --image-download-retry=3
        --push-retry=3
        --insecure
        --insecure-pull
    when:
      branch: main
      event: push

  - name: verify-images
    image: alpine:3.20
    commands:
      - apk add --no-cache curl jq
      - SHORT_SHA=$(printf '%s' "$CI_COMMIT_SHA" | cut -c1-8)
      - SRV_TAGS="$(curl -fsS http://registry.registry.svc.cluster.local:5000/v2/monkeypuzzle-server/tags/list)"
      - WEB_TAGS="$(curl -fsS http://registry.registry.svc.cluster.local:5000/v2/monkeypuzzle-website/tags/list)"
      - 'printf "%s" "$SRV_TAGS" | jq -e --arg TAG "$SHORT_SHA" ''.tags | index($TAG)'' >/dev/null && echo "server:$SHORT_SHA pushed"'
      - 'printf "%s" "$WEB_TAGS" | jq -e --arg TAG "$SHORT_SHA" ''.tags | index($TAG)'' >/dev/null && echo "website:$SHORT_SHA pushed"'
    when:
      branch: main
      event: push

  # --- Wait for ArgoCD + image-updater to roll the new digests live --------
  - name: wait-for-gitops
    image: alpine:3.20
    commands:
      - apk add --no-cache curl kubectl
      - >
        MANIFEST_ACCEPT='application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json';
        WEB_DIGEST=$(curl -fsS -D - -o /dev/null -H "Accept: $MANIFEST_ACCEPT" http://registry.registry.svc.cluster.local:5000/v2/monkeypuzzle-website/manifests/latest | awk -F': ' 'tolower($1)=="docker-content-digest"{gsub("\\r","",$2); print $2}');
        test -n "$WEB_DIGEST";
        echo "website digest $WEB_DIGEST"
      # Convergence is asserted on the website deployment itself: image pinned
      # to the digest just pushed, rollout updated, and nothing unavailable —
      # readyReplicas alone would count the OLD pod while a broken new one
      # crash-loops. Scoped to the website only: the server has no ArgoCD
      # Application (its deployment pulls :latest on restart), and the
      # woodpecker service account's RBAC (gitops repo,
      # monkeypuzzle/website/woodpecker-rbac.yaml) grants deployment/pod reads
      # in the monkeypuzzle namespace, not argocd — the old Application checks
      # were Forbidden and invisible behind 2>/dev/null. Don't re-silence
      # kubectl here.
      - >
        for attempt in $(seq 1 30); do
          IMG=$(kubectl -n monkeypuzzle get deployment monkeypuzzle-website -o jsonpath='{.spec.template.spec.containers[0].image}');
          UPDATED=$(kubectl -n monkeypuzzle get deployment monkeypuzzle-website -o jsonpath='{.status.updatedReplicas}');
          READY=$(kubectl -n monkeypuzzle get deployment monkeypuzzle-website -o jsonpath='{.status.readyReplicas}');
          UNAVAIL=$(kubectl -n monkeypuzzle get deployment monkeypuzzle-website -o jsonpath='{.status.unavailableReplicas}');
          echo "attempt $attempt: updated=$UPDATED ready=$READY unavailable=$${UNAVAIL:-0} image=$IMG";
          case "$IMG" in
            *"$WEB_DIGEST"*)
              if [ "$${UPDATED:-0}" -ge 1 ] && [ "$${READY:-0}" -ge 1 ] && [ "$${UNAVAIL:-0}" -eq 0 ]; then
                echo "website rolled out at $WEB_DIGEST"; exit 0;
              fi;;
          esac;
          if [ "$attempt" -eq 30 ]; then
            echo "Timed out: website did not converge to $WEB_DIGEST" >&2;
            exit 1;
          fi;
          sleep 10;
        done
    when:
      branch: main
      event: push

  # --- Release: cut binaries + Homebrew formula on a version tag -----------
  - name: release
    # Pinned: we use the deprecated-but-supported `brews` config (formula, not
    # cask — Linux/WSL support); an unpinned image could change behaviour.
    image: goreleaser/goreleaser:v2.16.0
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      HOMEBREW_TAP_GITHUB_TOKEN:
        from_secret: homebrew_tap_github_token
    commands:
      - goreleaser release --clean
    when:
      event: tag
